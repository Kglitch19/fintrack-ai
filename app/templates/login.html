<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="auth-page">
  <div class="login-container">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="FinTrack Logo" class="logo-login">
    <h2>FinTrack</h2>
    <p class="subtitle">Sign in to your account</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div>
          {% for category, message in messages %}
            <p class="alert {{ category }}">{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    <br>

    <form action="{{ url_for('login') }}" method="POST" class="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password">
      </div>
      <button type="submit" class="login-btn">Sign in</button>
    </form>
    <p class="register-text">Don’t have an account? <a href="/signup">Register here</a></p>
  </div>
</body>
</html>
