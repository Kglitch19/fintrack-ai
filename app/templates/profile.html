{% extends "base.html" %}

{% block title %}Profile{% endblock %}

{% block content %}
<div class="main-content">
<div class="profile-container">
  <h1>Your Profile</h1>

  <form action="{{ url_for('profile') }}" method="POST" enctype="multipart/form-data" class="profile-form">
    <div class="profile-pic-wrapper">
      {% if profile_pic_url %}
        <img src="{{ profile_pic_url }}" alt="Profile Picture" class="profile-pic">
      {% else %}
        <img id="preview" src="#" alt="Image preview" class="profile-pic hidden">
      {% endif %}
    </div>

    <label>Profile Picture:</label>
    <input type="file" name="profile_pic" accept="image/*" onchange="previewImage(event)">

    <label for="username" style="text-align: left;">Username:</label>
    <input type="text" name="username" id="username" value="{{ username }}" required>

    <label for="email" style="text-align: left;">Email:</label>
    <input type="email" name="email" id="email" value="{{ email }}" required>

    <button type="submit" class="btn-primary">Save Profile</button>
  </form>
</div>


<script>
  function previewImage(event) {
    const output = document.getElementById('preview');
    output.src = URL.createObjectURL(event.target.files[0]);
    output.style.display = 'block';
  }
</script>
</div>
{% endblock %}
